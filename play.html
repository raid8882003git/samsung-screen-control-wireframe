<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>屏幕播放</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    body { font-family: "Segoe UI", "PingFang HK", "Microsoft JhengHei", sans-serif; }
    img.poster {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      background: #111;
    }
    .hud {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 20px;
      color: #fff;
      background: rgba(0, 0, 0, 0.45);
      font-size: 14px;
      letter-spacing: 0.02em;
    }
    body.clean .hud { display: none; }
    .offline {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: #111;
      color: #fff;
      font-size: 28px;
    }
    body.offline .offline { display: flex; }
    body.offline img.poster,
    body.offline .hud { display: none; }
  </style>
</head>
<body>
  <img class="poster" id="poster" alt="">
  <div class="offline" id="offline">網絡未就緒，正在重試…</div>
  <div class="hud">
    <span id="who"></span>
    <span id="meta"></span>
  </div>
  <script>
    const ZONES = [
      { id: "ses", name: "三星專門店", count: 30, branches: ["尖沙咀海港城", "旺角 MOKO", "中環華人行", "沙田新城市廣場", "啟德 AIRSIDE", "太古", "九龍灣德福廣場", "荃灣千色匯", "將軍澳 PopCorn", "元朗形點"] },
      { id: "fortress", name: "豐澤", count: 30, branches: ["中環萬邦行", "銅鑼灣時代廣場", "圓方", "旺角好望角", "荃灣廣場"] },
      { id: "broadway", name: "百老匯", count: 32, branches: ["太古城中心", "銅鑼灣恒隆中心地庫", "銅鑼灣恒隆中心地下", "銅鑼灣時代廣場", "觀塘 apm", "九龍灣德福廣場", "鑽石山荷里活廣場", "旺角豉油街", "旺角西洋菜南街", "尖沙咀海港城", "上水新都廣場", "將軍澳東港城", "沙田新城市廣場", "荃灣眾安街", "屯門市廣場", "元朗教育路"] },
      { id: "wilson", name: "衛訊", count: 34, branches: ["荃灣大鴻輝中心", "銅鑼灣怡和街", "旺角百寶利商業中心", "旺角始創中心", "九龍灣德福廣場", "觀塘創紀之城五期", "荃灣南豐中心", "葵芳新都會廣場", "元朗形點 II", "元朗鈞德樓", "上水新都廣場", "上水廣場", "屯門 V city", "屯門市廣場", "大埔超級城", "沙田新城市廣場", "將軍澳 PopCorn"] },
      { id: "chungyuen", name: "中原電器", count: 30, branches: ["銅鑼灣時代廣場", "旺角新世紀廣場", "九龍灣德福廣場", "深水埗 V Walk", "將軍澳新都城", "荃灣廣場"] },
      { id: "telecom", name: "電訊數碼", count: 24, branches: ["旺角百寶利商業中心", "銅鑼灣怡和街", "觀塘 apm", "九龍灣德福廣場", "沙田廣場", "將軍澳東港城", "太子始創中心", "鑽石山荷里活廣場"] },
      { id: "carrier", name: "1010／csl", count: 20, branches: ["1010 銅鑼灣時代廣場", "1010 旺角朗豪坊", "1010 沙田新城市廣場", "1010 中環", "1010 觀塘 apm", "csl 銅鑼灣", "csl 旺角", "csl 沙田新城市廣場", "csl 荃灣", "csl 將軍澳"] }
    ];
    const POSTERS = {
      "img-spring": { name: "春季主視覺", bg: "#14365c", accent: "#7eb6e0", ink: "#f4f7fb" },
      "img-sale": { name: "會員日促銷", bg: "#6a3014", accent: "#f0b48a", ink: "#fff6ef" },
      "img-dining": { name: "家電組合", bg: "#143d30", accent: "#8dceba", ink: "#f3faf7" },
      "img-wayfind": { name: "Galaxy 新品", bg: "#0f3f3c", accent: "#8fd4cb", ink: "#f3fbfa" },
      "img-event": { name: "週末活動", bg: "#3a2b66", accent: "#c4b4ef", ink: "#f7f4ff" },
      "img-wear": { name: "穿戴裝置", bg: "#2c3138", accent: "#c5c8ce", ink: "#f6f7f8" },
      "img-night": { name: "夜間品牌", bg: "#3d2036", accent: "#e7b0d0", ink: "#fff5fa" }
    };

    function imageForZone(zoneId, index) {
      if (zoneId === "ses") return index % 5 === 0 ? "img-wayfind" : "img-spring";
      if (zoneId === "fortress") return index % 4 === 0 ? "img-event" : "img-sale";
      if (zoneId === "broadway") return index % 3 === 0 ? "img-event" : "img-sale";
      if (zoneId === "wilson") return index % 2 === 0 ? "img-wayfind" : "img-spring";
      if (zoneId === "chungyuen") return index % 4 === 0 ? "img-night" : "img-dining";
      if (zoneId === "telecom") return index % 5 === 0 ? "img-wear" : "img-event";
      return "img-spring";
    }

    function findScreen(raw) {
      const match = /^SCR-(\d{1,3})$/i.exec((raw || "SCR-001").trim());
      const n = match ? Number(match[1]) : 1;
      if (n < 1 || n > 200) return null;
      let cursor = 1;
      for (const zone of ZONES) {
        if (n < cursor || n >= cursor + zone.count) {
          cursor += zone.count;
          continue;
        }
        const index = n - cursor + 1;
        const perBranch = zone.count / zone.branches.length;
        return {
          id: "SCR-" + String(n).padStart(3, "0"),
          place: zone.name + " · " + zone.branches[Math.floor((index - 1) / perBranch)],
          imageId: imageForZone(zone.id, index)
        };
      }
      return null;
    }

    function posterUri(poster, place, screenId) {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
        <rect width="1920" height="1080" fill="${poster.bg}"/>
        <rect width="28" height="1080" fill="${poster.accent}"/>
        <circle cx="1500" cy="540" r="280" fill="none" stroke="${poster.accent}" stroke-width="18"/>
        <rect x="1288" y="300" width="424" height="480" rx="36" fill="none" stroke="${poster.accent}" stroke-width="10"/>
        <text x="120" y="430" fill="${poster.ink}" font-family="Microsoft JhengHei, PingFang HK, sans-serif" font-size="108" font-weight="700">${poster.name}</text>
        <text x="120" y="530" fill="${poster.accent}" font-family="Microsoft JhengHei, PingFang HK, sans-serif" font-size="40">${place}</text>
        <text x="120" y="980" fill="${poster.ink}" font-family="Segoe UI, sans-serif" font-size="28" opacity="0.8">${screenId} · 1920×1080</text>
      </svg>`;
      return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
    }

    const params = new URLSearchParams(location.search);
    if (params.get("clean") === "1") document.body.classList.add("clean");
    const screen = findScreen(params.get("screen"));
    const forced = POSTERS[params.get("image")];
    const poster = forced || (screen && POSTERS[screen.imageId]) || POSTERS["img-spring"];
    const place = screen ? screen.place : "未知屏幕";
    const screenId = screen ? screen.id : (params.get("screen") || "SCR-001");
    const img = document.getElementById("poster");
    img.alt = poster.name + " " + screenId;
    img.src = posterUri(poster, place, screenId);
    document.getElementById("who").textContent = screenId + " · " + place + " · " + poster.name;

    function tick() {
      const now = new Date();
      const clock = now.toLocaleTimeString("zh-HK", { hour12: false });
      const size = window.innerWidth + "×" + window.innerHeight;
      document.getElementById("meta").textContent = size + " · " + clock + " · " + (navigator.onLine ? "在線" : "離線");
    }
    tick();
    setInterval(tick, 1000);

    function showOffline(on) {
      document.body.classList.toggle("offline", on);
    }
    async function keepAwake() {
      try { await navigator.wakeLock?.request("screen"); } catch (error) { /* signage may block the lock */ }
    }
    function watchNetwork() {
      showOffline(!navigator.onLine);
      if (!navigator.onLine) setTimeout(() => location.reload(), 5000);
    }
    window.addEventListener("offline", watchNetwork);
    window.addEventListener("online", () => location.reload());
    document.addEventListener("visibilitychange", () => { if (!document.hidden) keepAwake(); });
    img.addEventListener("error", () => { showOffline(true); setTimeout(() => location.reload(), 5000); });
    keepAwake();
    watchNetwork();

    const refresh = Number(params.get("refresh"));
    if (refresh >= 15) setInterval(() => location.reload(), refresh * 1000);
  </script>
</body>
</html>
